[project]
name = "pathfinder-backend"
version = "0.1.0"
description = "Backend API for PathFinder AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "alembic",
    "pwdlib[argon2]",
    "PyJWT",
    "email-validator",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", ".."]
include = ["app", "app.*", "ai", "ai.chatbot", "ai.chatbot.*"]
