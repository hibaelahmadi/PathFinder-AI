[project]
name = "pathfinder-backend"
version = "0.1.0"
description = "Backend API for PathFinder AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "alembic",
    "pwdlib[argon2]",
    "PyJWT",
    "email-validator",
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]
gemini = ["google-genai==3.3.0", "python-dotenv==1.2.4"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "..", "../Pathfinder_P4_Livraison/Pathfinder_P4/src"]
include = [
    "app", "app.*", "ai", "ai.chatbot", "ai.chatbot.*",
    "ai.recommendation", "ai.recommendation.*",
    "pathfinder_p4", "pathfinder_p4.*",
]
